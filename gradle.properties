#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Sat May 06 12:58:51 BST 2023
android.enableJetifier=true
android.nonTransitiveRClass=true
android.useAndroidX=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx1536M -Dkotlin.daemon.jvm.options\="-Xmx1024M" -XX\:+HeapDumpOnOutOfMemoryError -Dfile.encoding\=UTF-8
android.enableR8.fullMode=false

# ---- Fork (shiroikuma.kabukahyoji) ----------------------------------------
# VERSION_NAME tracks the upstream premnirmal/StockTicker release tag.
# BUILD_NUMBER is our fork increment: reset to 1 on each upstream rebase, +1 on
# every build (the :app:buildFoss task bumps it automatically).
# Fork versionName = "<VERSION_NAME>+<BUILD_NUMBER>" (e.g. 4.0.081+1).
# Fork versionCode = (major*100000 + minor*1000 + patch) * 100 + BUILD_NUMBER.
# See app/build.gradle.kts, .claude/skills, and CLAUDE.md "Fork layer".
VERSION_NAME=4.1.004
BUILD_NUMBER=3
APP_ID=shiroikuma.kabukahyoji